{% extends "base.html" %}
{% block title %}Authentication code · CMT{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="page-card p-4">
      <h1 class="h3">Authentication code</h1>
      <p class="text-secondary">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="code">Authentication code</label>
        <input class="form-control mb-3" id="code" name="code" autocomplete="one-time-code" required>
        <button class="btn btn-accent w-100" type="submit">Continue</button>
      </form>
      <a class="btn btn-link px-0 mt-2" href="{{ url_for('auth.mfa_cancel') }}">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
