{% if pagination and pagination.total_pages %}
<nav class="mt-3" aria-label="Pagination">
  <ul class="pagination">
    <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
      <a class="page-link" href="?page={{ pagination.page - 1 }}{% if request.args.get('q') %}&q={{ request.args.get('q') }}{% endif %}">Previous</a>
    </li>
    <li class="page-item disabled"><span class="page-link">Page {{ pagination.page }} of {{ pagination.total_pages }} · {{ pagination.total }} records</span></li>
    <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
      <a class="page-link" href="?page={{ pagination.page + 1 }}{% if request.args.get('q') %}&q={{ request.args.get('q') }}{% endif %}">Next</a>
    </li>
  </ul>
</nav>
{% endif %}
