{% extends "base.html" %}
{% block title %}Confirm password · CMT{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <form class="page-card p-4" method="post">
      <h1 class="h3">Confirm your password</h1>
      <p class="text-secondary">Account changes ask for your password again. This confirmation lasts 10 minutes.</p>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-accent" type="submit">Confirm</button>
    </form>
  </div>
</div>
{% endblock %}
