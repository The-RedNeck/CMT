<div class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Type</label>
    <select class="form-select" name="maintenance_type" required>
      {% for option in ['Preventive', 'Corrective', 'Predictive', 'Condition-Based'] %}
      <option {% if maintenance is defined and maintenance.maintenance_type == option %}selected{% endif %}>{{ option }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Priority</label>
    <select class="form-select" name="priority" required>
      {% for option in ['Low', 'Medium', 'High', 'Critical'] %}
      <option {% if maintenance is defined and maintenance.priority == option %}selected{% endif %}>{{ option }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Start date</label>
    <input class="form-control" type="date" name="start_date" required value="{{ maintenance.start_date.isoformat() if maintenance is defined and maintenance.start_date else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">End date</label>
    <input class="form-control" type="date" name="end_date" value="{{ maintenance.end_date.isoformat() if maintenance is defined and maintenance.end_date else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Cost</label>
    <input class="form-control" type="number" min="0" step="0.01" name="cost" value="{{ maintenance.cost if maintenance is defined and maintenance.cost is not none else '' }}">
  </div>
  <div class="col-12">
    <label class="form-label">Description</label>
    <textarea class="form-control" name="description" required rows="3">{{ maintenance.description if maintenance is defined else '' }}</textarea>
  </div>
  <div class="col-md-6">
    <label class="form-label">Findings</label>
    <textarea class="form-control" name="findings" rows="2">{{ maintenance.findings if maintenance is defined and maintenance.findings else '' }}</textarea>
  </div>
  <div class="col-md-6">
    <label class="form-label">Recommendations</label>
    <textarea class="form-control" name="recommendations" rows="2">{{ maintenance.recommendations if maintenance is defined and maintenance.recommendations else '' }}</textarea>
  </div>
  <div class="col-12 form-check">
    <input class="form-check-input" type="checkbox" name="requires_followup" id="requires_followup" {% if maintenance is defined and maintenance.requires_followup %}checked{% endif %}>
    <label class="form-check-label" for="requires_followup">Requires follow-up</label>
  </div>
</div>
