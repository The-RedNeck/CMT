{% extends "base.html" %}
{% block title %}New location · CMT{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New location</h1>
<form class="page-card p-4" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label class="form-label">Code</label><input class="form-control" name="code" required></div>
  <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" checked>
    <label class="form-check-label" for="is_active">Active</label>
  </div>
  <button class="btn btn-accent" type="submit">Save location</button>
</form>
{% endblock %}
