{% extends "base.html" %}
{% block title %}New asset type · CMT{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New asset type</h1>
<form class="page-card p-4" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
  <button class="btn btn-accent" type="submit">Save type</button>
</form>
{% endblock %}
