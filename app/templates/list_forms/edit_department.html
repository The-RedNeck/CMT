{% extends "base.html" %}
{% block title %}Edit department · CMT{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit {{ department.name }}</h1>
<form class="page-card p-4" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required value="{{ department.name }}"></div>
    <div class="col-md-6"><label class="form-label">Code</label><input class="form-control" name="code" required value="{{ department.code or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Cost center</label><input class="form-control" name="cost_center" value="{{ department.cost_center or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Budget</label><input class="form-control" type="number" min="0" step="0.01" name="budget" value="{{ department.budget if department.budget is not none else '' }}"></div>
    <div class="col-md-6">
      <label class="form-label">Manager</label>
      <select class="form-select" name="manager_id">
        <option value="">None</option>
        {% for employee in all_employees|default([]) %}
        <option value="{{ employee.id }}" {% if department.manager_id == employee.id %}selected{% endif %}>{{ employee.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Parent department</label>
      <select class="form-select" name="parent_department_id">
        <option value="">None</option>
        {% for item in all_departments|default([]) %}
        <option value="{{ item.id }}" {% if department.parent_department_id == item.id %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ department.description or '' }}</textarea></div>
  </div>
  <button class="btn btn-accent mt-3" type="submit">Save department</button>
</form>
{% endblock %}
